[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soozip-gaebal"
version = "0.5.2"
description = "Soozip online package builder and Gaebal offline installer for Ubuntu 24.04"
requires-python = ">=3.12"
readme = "README.md"
dependencies = ["packaging==26.3"]

[project.optional-dependencies]
desktop = ["PySide6==6.10.1"]
release = ["PySide6==6.10.1", "PyInstaller==6.17.0"]

[project.scripts]
offline-apt-builder = "offline_apt_builder.cli:main"
soozip = "soozip.app:main"
gaebal = "gaebal.app:main"
offline-apt-worker = "offline_apt_builder.worker:main"

[tool.setuptools.packages.find]
where = ["src", "Soozip/src", "Gaebal/src"]

[tool.setuptools.package-data]
offline_apt_builder = ["resources/*"]
